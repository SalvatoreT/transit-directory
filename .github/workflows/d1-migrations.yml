name: Apply D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Apply D1 Migrations
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          # Must match deploy.yml: wrangler 4.x refuses to run on Node < 22,
          # which made this job fail before it applied any SQL.
          node-version: 22
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply gtfs_data --remote
